<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Verilog Generator</title>
  <!-- Tailwind CSS CDN for quick UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Monaco Editor CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-400">Verilog Live Code Generator</h1>
    <span class="text-xs bg-blue-900 text-blue-200 px-2.5 py-1 rounded-full font-mono">JS + Monaco Engine</span>
  </header>

  <!-- Main Container -->
  <div class="flex flex-1 h-[calc(100vh-65px)]">
    
    <!-- Sidebar / Parameters UI -->
    <div class="w-1/3 bg-gray-800/50 p-6 border-r border-gray-700 flex flex-col gap-6 overflow-y-auto">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Block Type</label>
        <select id="blockType" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          <option value="mux">2-to-1 Multiplexer</option>
          <option value="dff">D Flip-Flop (Async Reset)</option>
          <option value="adder">Ripple Carry Adder</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Module Name</label>
        <input type="text" id="moduleName" value="my_digital_block" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 font-mono text-sm" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Data Bit Width (N-Bits)</label>
        <input type="number" id="bitWidth" value="8" min="1" max="128" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 font-mono text-sm" />
      </div>

      <!-- Additional Options -->
      <div id="extraOptions" class="border-t border-gray-700 pt-4 flex flex-col gap-3">
        <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-300">
          <input type="checkbox" id="enableClockEnable" class="rounded bg-gray-700 border-gray-600 text-blue-500 focus:ring-0">
          <span>Include Clock Enable (CE)</span>
        </label>
      </div>
    </div>

    <!-- Code Editor Panel -->
    <div class="w-2/3 flex flex-col bg-[#1e1e1e]">
      <div class="bg-gray-800/80 px-4 py-2 border-b border-gray-700 text-xs font-mono text-gray-400 flex justify-between items-center">
        <span>Generated Output: <strong id="fileName" class="text-gray-200">my_digital_block.v</strong></span>
        <button id="copyBtn" class="hover:text-white bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs transition">Copy Code</button>
      </div>
      <div id="monaco-container" class="flex-1 w-full h-full"></div>
    </div>

  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // --- 1. Verilog Code Generator Core Class ---
    class VerilogModule {
      constructor(name) {
        this.name = name;
        this.parameters = [];
        this.ports = [];
        this.body = [];
      }

      addParameter(name, value) {
        this.parameters.push({ name, value });
        return this;
      }

      addPort(direction, width, name) {
        this.ports.push({ direction, width, name });
        return this;
      }

      addLogic(line) {
        this.body.push(line);
        return this;
      }

      emit() {
        let code = `module ${this.name}\n`;

        // Parameters
        if (this.parameters.length > 0) {
          const paramsStr = this.parameters
            .map(p => `  parameter ${p.name} = ${p.value}`)
            .join(',\n');
          code += `#(\n${paramsStr}\n)\n`;
        }

        // Ports
        if (this.ports.length > 0) {
          const portsStr = this.ports
            .map(p => {
              const widthStr = p.width > 1 ? `[${p.width - 1}:0]`.padEnd(8) : ' '.repeat(8);
              const dirStr = p.direction.padEnd(6);
              return `  ${dirStr} wire ${widthStr} ${p.name}`;
            })
            .join(',\n');
          code += `(\n${portsStr}\n);\n\n`;
        }

        // Logic Body
        code += this.body.map(line => line ? `  ${line}` : '').join('\n');
        code += `\n\nendmodule\n`;

        return code;
      }
    }

    // --- 2. Digital Block Generators ---
    function generateVerilog(type, name, width, hasCE) {
      const mod = new VerilogModule(name);
      mod.addParameter('DATA_WIDTH', width);

      if (type === 'mux') {
        mod.addPort('input', width, 'a')
           .addPort('input', width, 'b')
           .addPort('input', 1, 'sel')
           .addPort('output', width, 'out')
           .addLogic('// 2-to-1 Multiplexer Assignment')
           .addLogic('assign out = sel ? b : a;');
      } 
      else if (type === 'dff') {
        mod.addPort('input', 1, 'clk')
           .addPort('input', 1, 'rst_n');

        if (hasCE) mod.addPort('input', 1, 'ce');

        mod.addPort('input', width, 'd')
           .addPort('output', width, 'q')
           .addLogic('reg [DATA_WIDTH-1:0] q_reg;')
           .addLogic('')
           .addLogic('always @(posedge clk or negedge rst_n) begin')
           .addLogic('  if (!rst_n) begin')
           .addLogic('    q_reg <= {DATA_WIDTH{1\'b0}};')
           .addLogic('  end');

        if (hasCE) {
          mod.addLogic('  else if (ce) begin')
             .addLogic('    q_reg <= d;')
             .addLogic('  end');
        } else {
          mod.addLogic('  else begin')
             .addLogic('    q_reg <= d;')
             .addLogic('  end');
        }

        mod.addLogic('end')
           .addLogic('')
           .addLogic('assign q = q_reg;');
      } 
      else if (type === 'adder') {
        mod.addPort('input', width, 'a')
           .addPort('input', width, 'b')
           .addPort('input', 1, 'cin')
           .addPort('output', width, 'sum')
           .addPort('output', 1, 'cout')
           .addLogic('// Ripple Carry / Addition logic')
           .addLogic('assign {cout, sum} = a + b + cin;');
      }

      return mod.emit();
    }

    // --- 3. Monaco Editor & UI Integration ---
    let editor;

    // Load Monaco Editor
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      // Initialize Monaco Editor instance
      editor = monaco.editor.create(document.getElementById('monaco-container'), {
        value: '',
        language: 'verilog',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false },
        readOnly: true
      });

      // Render initial code
      updateCode();
    });

    // Handle Form Inputs
    const blockTypeEl = document.getElementById('blockType');
    const moduleNameEl = document.getElementById('moduleName');
    const bitWidthEl = document.getElementById('bitWidth');
    const enableCEEl = document.getElementById('enableClockEnable');
    const fileNameEl = document.getElementById('fileName');

    function updateCode() {
      if (!editor) return;

      const type = blockTypeEl.value;
      const name = moduleNameEl.value.trim() || 'my_module';
      const width = parseInt(bitWidthEl.value, 10) || 8;
      const hasCE = enableCEEl.checked;

      // Update Header Filename Display
      fileNameEl.textContent = `${name}.v`;

      // Generate Verilog & set inside editor
      const code = generateVerilog(type, name, width, hasCE);
      editor.setValue(code);
    }

    // Attach Event Listeners for Live Updates
    blockTypeEl.addEventListener('change', () => {
      // Toggle visibility of CE for D-FF block only
      enableCEEl.parentElement.style.display = blockTypeEl.value === 'dff' ? 'flex' : 'none';
      updateCode();
    });
    moduleNameEl.addEventListener('input', updateCode);
    bitWidthEl.addEventListener('input', updateCode);
    enableCEEl.addEventListener('change', updateCode);

    // Copy Button Functionality
    document.getElementById('copyBtn').addEventListener('click', () => {
      if (!editor) return;
      navigator.clipboard.writeText(editor.getValue());
      
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy Code', 1500);
    });

    // Hide CE option initially if not DFF
    enableCEEl.parentElement.style.display = 'none';
  </script>
</body>
</html>
